backend:
  name: github
  repo: PiperHolliwel/ssc-europe-website
  branch: main
  # Replace with your deployed OAuth Worker's URL (see README ->
  # "Setting up the content editor"). Example: https://ssc-oauth.olena.workers.dev
  base_url: https://ssc-cms-auth.olenababii-tests.workers.dev
  auth_endpoint: auth

# Every edit made through this editor is committed straight to the "main"
# branch, which is exactly what's live on the site (there's no build step
# to review a draft first) — so changes go live as soon as Cloudflare Pages
# finishes rebuilding, usually well under a minute after saving here.
publish_mode: simple

media_folder: "images/experts"
public_folder: "/images/experts"

collections:
  - name: "settings"
    label: "Contact info & address"
    delete: false
    editor:
      preview: false
    files:
      - name: "settings"
        label: "Contact details"
        file: "content/settings.yml"
        fields:
          - { label: "Organization name (footer)", name: "org_name", widget: "string" }
          - { label: "Contact person (Kontakt page)", name: "contact_person", widget: "string" }
          - { label: "Street & house number", name: "street", widget: "string" }
          - { label: "City line (German pages)", name: "city_de", widget: "string" }
          - { label: "City line (English pages)", name: "city_en", widget: "string" }
          - { label: "Email address", name: "email", widget: "string" }
          - { label: "Phone number (as shown to visitors)", name: "phone_display", widget: "string" }
          - { label: "Phone number (for click-to-call links, digits only, e.g. +493065791250)", name: "phone_tel", widget: "string" }

  - name: "pages"
    label: "Page content"
