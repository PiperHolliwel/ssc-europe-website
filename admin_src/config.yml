  - name: "experts"
    label: "Expert profiles"
    folder: "content/experts"
    extension: "yml"
    format: "yml"
    create: true
    slug: "{{slug}}"
    identifier_field: "slug"
    editor:
      preview: false
    fields:
      - { label: "URL slug (letters/numbers/hyphens only, no spaces — changing this changes the profile's web address)", name: "slug", widget: "string", pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only"] }
      - { label: "Display order (lower numbers show first in the experts grid)", name: "display_order", widget: "number", value_type: "int" }
      - { label: "Photo", name: "photo", widget: "image" }
      - { label: "Email", name: "email", widget: "string" }
      - { label: "Phone", name: "phone", widget: "string", required: false }
      - { label: "Name (German)", name: "name_de", widget: "string" }
      - { label: "Name (English)", name: "name_en", widget: "string" }
      - { label: "Areas of expertise (German)", name: "expertise_de", widget: "text" }
      - { label: "Areas of expertise (English)", name: "expertise_en", widget: "text" }
      - { label: "Bio (German)", name: "bio_de", widget: "markdown", required: false }
      - { label: "Bio (English)", name: "bio_en", widget: "markdown", required: false }
      - { label: "Activities & talks (German)", name: "activity_history_de", widget: "markdown", required: false }
      - { label: "Activities & talks (English)", name: "activity_history_en", widget: "markdown", required: false }
