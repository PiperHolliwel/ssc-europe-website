eyebrow_de: Segment 02
eyebrow_en: Segment 02
pagetitle_de: Simulationen
pagetitle_en: Simulations
pagelead_de: Planspiele als didaktische Methode – für Lehre, Fortbildung, Krisenmanagement
  und Teambuilding.
pagelead_en: A didactic method for teaching, in-house training, crisis management
  and team building.
p1_de: Simulationen bzw. Planspiele sind eine didaktische Methode, die aus dem Bereich
  des Theaters entlehnt ist. Im Unterschied zu der Aufführung eines Stücks werden
  hierbei allerdings keine Dialoge vorgegeben. Die Teilnehmer erhalten zwar ein Rollenprofil
  mit Hintergrundinformationen, haben in der Ausführung dieser Rolle aber – innerhalb
  eines realistischen Rahmens – Handlungsfreiheit.
p1_en: Simulations are a didactic method derived from theater. Contrary to role playing,
  it functions without pre-written dialogues. Participants receive a role profile
  with basic facts but are free to improvise their way of interpretation within realistic
  boundaries.
p2_de: Simulationen werden zum einen zur Fortbildung bzw. anschaulicher Vermittlung
  an Studenten im Rahmen von Seminaren über die Funktion und Arbeitsweise Internationaler
  Organisationen angeboten. Zum anderen werden auch Szenarien nach den Bedürfnissen
  von Kunden entwickelt, zum Beispiel als didaktisches Mittel in der innerbetrieblichen
  Fortbildung, zum Krisenmanagement oder für Teambuildingmaßnahmen.
p2_en: Simulations are a highly effective tool for educating students by placing them
  into descriptive learning situations in order to build practical and applied skills.
  For instance, by placing them into scenarios modeled on the structure of international
  organisations, students interact and form the sort of compromises that are commonplace
  in the everyday life of such organisations. SSC Europe thus develops scenarios fitted
  to the needs of our customers, e.g. as a didactic method for in-house training,
  for crisis management training or team-building exercises.
p3_de: Gerne entwickeln wir ein passendes Format für Sie. Egal ob Simulation von Politikentscheidungsprozessen
  für Schüler und Studenten oder Krisenmanagement zur Mitarbeiterschulung, SSC Europe
  stellt Ihnen ein geeignetes Szenario zusammen und führt dieses auch unter Anleitung
  unserer Experten mit Ihnen durch.
p3_en: We will develop a suitable format for your exercise. We conduct simulations
  about is both policy making processes as an interactive learning tool for students
  or crisis scenarios to prepare your colleagues for new responsibilities. SSC Europe
  will assemble a suitable format and carry out the exercise under the guidance of
  our experts.
