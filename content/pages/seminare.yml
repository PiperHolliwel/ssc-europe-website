eyebrow_de: Segment 01
eyebrow_en: Segment 01
pagetitle_de: Seminare
pagetitle_en: Seminars
pagelead_de: Fortbildungen, Seminare und Sommerschulen für Lehrkräfte, Studierende
  und zivilgesellschaftliche Akteure.
pagelead_en: Further education, summer schools and informational meetings for teachers,
  students and civil society actors.
p1_de: Unsere Experten verfügen über langjährige Erfahrung in der Durchführung von
  Seminaren für diverse Kooperationspartner. Wir bieten unterschiedliche Formate für
  Fortbildungen von Lehrkräften, Seminare und Sommerschulen für Studenten und zivilgesellschaftliche
  Akteure sowie Informationsveranstaltungen für die interessierte Öffentlichkeit.
p1_en: The experts of SSC Europe have an extensive experience in conceptualising and
  holding seminars for different partners. We offer different formats for further
  education, summer schools and informational meetings.
p2_de: Unsere Experten verfügen über ein breites Spektrum von Kursangeboten. Die angebotenen
  Seminare erstrecken sich von Europäischer Integration über Sicherheitspolitik bis
  hin zu Fragen des Public Policy Making. Die Mitglieder des Netzwerks von SSC Europe
  waren an renommierten Universitäten wie zum Beispiel der Ludwig-Maximilians-Universität
  München, der Eberhard Karls Universität Tübingen, der Karls-Universität Prag, der
  Andrássy-Universität Budapest oder der Chulalongkorn-Universität Bangkok tätig.
p2_en: Our experts have a broad portfolio of courses at their disposal. The seminars
  range from European integration over security policy to questions of public policy
  making. The members of the SSC Europe network have been teaching at renowned universities
  such as the Ludwig-Maximilians-University Munich, the Georg-August-University Göttingen,
  the Charles-University Prague, the Andrássy-University Budapest or the Chualongkorn-University
  Bangkok.
