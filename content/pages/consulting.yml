eyebrow_de: Segment 03
eyebrow_en: Segment 03
pagetitle_de: Consulting
pagetitle_en: Consulting
pagelead_de: 'Beratung und Meinungsbildung: Dossiers, Länderstudien, wissenschaftliche
  Beratung und Fachkonferenzen.'
pagelead_en: 'Consulting and opinion making: dossiers, country studies, academic advice
  and symposia.'
p1_de: Das dritte Segment umfasst den Bereich Beratung sowie Meinungsbildung. Zu den
  einzelnen Dienstleistungen zählen das Erstellen von Dossiers und Länderstudien,
  wissenschaftliche Beratung sowie die Organisation von Fachkonferenzen.
p1_en: The third segment covers the area consulting and opinion making. Our services
  include the development of dossiers and country studies, academic advice as well
  as the organisation of symposia.
p2_de: Zu unserem Angebotsspektrum gehört auch das Verfassen von Positionspapieren.
  Sebastian Schäffer und Michael Bauer sind Teil des Editorenteams einer Publikationsreihe
  (C·A·Perspectives), die sich mit aktuellen Entwicklungen und Herausforderungen internationaler
  Politik beschäftigen, die Europa und die Europäische Union betreffen. Darüber hinaus
  verfassen unsere Experten regelmäßig Aufsätze in akademischen Zeitschriften und
  Buchbeiträge in ihren jeweiligen Expertisebereichen. Die Mitglieder des Netzwerks
  von SSC Europe halten zudem Fachvorträge und stehen für Anfragen von Seiten der
  Medien zur Verfügung.
p2_en: Furthermore we offer policy advice in a succinct format. Sebastian Schäffer
  and Michael Bauer are editors of a policy paper series (C·A·Perspectives), dealing
  with current challenges and developments in international politics that affect Europe
  and the European Union. Our experts publish regularly in academic journals and book
  contributions in their area of expertise. The members of our network moreover hold
  specialised lectures and have given expert opinions in several media interviews.
p3_de: Unsere Experten agieren dabei unabhängig und überparteilich. In unserer Tätigkeit
  halten wir uns an die Regeln des guten wissenschaftlichen Arbeitens und respektieren
  den Kodex für wissenschaftliche Beratung. In Zeiten, in denen Entscheidungen im
  politischen Prozess oftmals als alternativlos und kompliziert deklariert werden,
  versuchen wir Alternativen aufzuzeigen und Entscheidungsprozesse verständlich zu
  vermitteln.
p3_en: Our experts work independently and non-partisan. In our work, we respect the
  rules of academic rigour and respect the codex for academic consulting. In times
  when decisions within the political process are often marked without alternative
  and too complex, we aspire to elaborate alternatives and make decision-making processes
  understandable.
