eyebrow_de: Über uns
eyebrow_en: About
pagetitle_de: Über SSC Europe
pagetitle_en: About SSC Europe
pagelead_de: 'Zwei Säulen: drei Leistungssegmente und ein Netzwerk von Expertinnen
  und Experten.'
pagelead_en: 'Two pillars: three service segments and a network of experts.'
intro_p1_de: SSC Europe baut auf zwei Säulen – sogenannten Pillars – auf. Die erste
  Säule besteht aus den drei Segmenten Seminare, Simulationen (Planspiele) und Consulting
  (Beratung). Die zweite Säule repräsentiert das Netzwerk der Experten, die durch
  ihre individuellen Qualifikationen zu den oben genannten drei Segmenten beitragen
  können.
intro_p1_en: SSC Europe consists of two pillars. The three segments of seminars, simulations
  and consulting compose the first, and the second represents the network of experts
  that contribute to those segments through their individual qualifications.
intro_p2_de: Wir erweitern ständig unser Netzwerk und unsere Angebote. Bereits jetzt
  verfügen wir über ein breites Portfolio, das wir gerne individuell auf Ihre Bedürfnisse
  anpassen. Sie können jederzeit mit uns in Kontakt treten. Gerne unterbreiten wir
  Ihnen ein maßgeschneidertes Paket für Ihre Anforderungen.
intro_p2_en: We are continuously enlarging our network as well as the delivered products
  and services. Our experts already possess a broad range of formats at hand. Don't
  hesitate to contact us for a customized offer for your needs.
intro_p3_de: SSC Europe bietet zudem jungen Akademikern die Möglichkeit Ihre Ideen,
  Erfahrung und Expertise miteinzubringen. Wenn Sie Interesse an einer Teilnahme in
  unserem Netzwerk haben, nutzen Sie bitte ebenfalls unser Kontaktformular und teilen
  uns Ihre Konzepte und bisherige Ausbildung mit.
intro_p3_en: SSC Europe furthermore offers young academics the opportunity to share
  their ideas, experience and expertise with our network. If you are interested in
  participating at SSC Europe, please send us an email with your concepts and educational
  background or use our contact form.
