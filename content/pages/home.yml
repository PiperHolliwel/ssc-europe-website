eyebrow_de: Seminars · Simulations · Consulting
eyebrow_en: Seminars · Simulations · Consulting
hero_title_de: Willkommen bei SSC Europe!
hero_title_en: Welcome to SSC Europe!
hero_lead_de: Seminars Simulations Consulting (SSC) Europe fungiert als
  Plattform für die Vermittlung von Experten für die drei Segmente Seminare,
  Simulationen (Planspiele) und Beratung.
hero_lead_en: Seminars Simulations Consulting (SSC) Europe is a platform of
  experts for its three segments Seminars, Simulations and Consulting.
segments_kicker_de: Unsere Segmente
segments_kicker_en: Our segments
segments_h2_de: Drei Segmente, ein Expertennetzwerk
segments_h2_en: Three segments, one network of experts
segments_lead_de: "SSC Europe baut auf zwei Säulen auf: den drei
  Leistungssegmenten und dem Netzwerk der Expertinnen und Experten, die mit
  ihren individuellen Qualifikationen dazu beitragen."
segments_lead_en: "SSC Europe consists of two pillars: the three service
  segments, and the network of experts who contribute to them through their
  individual qualifications."
card1_title_de: Seminare
card1_title_en: Seminars
card1_text_de: Fortbildungen für Lehrkräfte, Seminare und Sommerschulen für
  Studierende und zivilgesellschaftliche Akteure sowie
  Informationsveranstaltungen.
card1_text_en: Training for teachers, seminars and summer schools for students
  and civil society actors, and public information events.
card2_title_de: Simulationen
card2_title_en: Simulations
card2_text_de: Planspiele als didaktische Methode – von
  Politikentscheidungsprozessen für Studierende bis zu Krisenmanagement und
  Teambuilding.
card2_text_en: Simulations as a didactic method – from political decision-making
  for students to crisis management and team building.
card3_title_de: Consulting
card3_title_en: Consulting
card3_text_de: Dossiers und Länderstudien, wissenschaftliche Beratung,
  Positionspapiere und die Organisation von Fachkonferenzen.
card3_text_en: Dossiers and country studies, academic consulting, position
  papers and the organisation of expert conferences.
network_kicker_de: Das Netzwerk
network_h2_de: Expertise aus Wissenschaft und Praxis
network_lead_de: Unsere Expertinnen und Experten waren an renommierten
  Universitäten tätig – unter anderem in München, Tübingen, Prag, Budapest und
  Bangkok – und arbeiten unabhängig und überparteilich. Ihre Schwerpunkte
  reichen von Europäischer Nachbarschaftspolitik über Sicherheitspolitik bis zu
  Demokratieforschung.
band_title_de: Ein maßgeschneidertes Paket für Ihre Anforderungen
band_title_en: A customized offer for your needs
band_lead_de: Wir erweitern ständig unser Netzwerk und unsere Angebote. Sie
  können jederzeit mit uns in Kontakt treten – gerne unterbreiten wir Ihnen ein
  individuelles Angebot.
band_lead_en: We are continuously enlarging our network as well as the delivered
  products and services. Don't hesitate to contact us for a customized offer.
