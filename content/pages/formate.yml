s2_kicker_en: Format
s2_h2_de: Planspiele / Simulationen
s2_h2_en: Simulations
s2_text1_de: Simulationen kommen bei uns in unterschiedlichen Kontexten zum Einsatz.
  Zum Beispiel als begleitendes Element zur praktischen Ergänzung der theoretischen
  Wissensvermittlung in einem Universitätsseminar. Im Kurs „European Governance“ an
  der Zeppelin Universität Friedrichshafen übernahmen dabei die Studenten die Rolle
  von Staats- und Regierungschefs bei den Budgetverhandlungen im Europäischen Rat
  zur Veranschaulichung der institutionellen Verflechtungen der Europäischen Union,
  die zuvor von den Kursleitern Michael Bauer und Sebastian Schäffer erläutert worden
  waren.
s2_text1_en: We use simulations in different contexts. We utilize these simulations
  as hands-on accompaniments to the theoretical knowledge gained in university seminars.
  For example, in the course “European Governance” at Zeppelin University Friedrichshafen,
  the students assume the roles of politicians for the budget negotiations in the
  European Council. This segment is utilized to illustrate the institutional linkages
  of the European Union, which earlier had been discussed by the instructors Michael
  Bauer and Sebastian Schäffer.
s2_text2_de: Planspiele eignen sich aber auch als methodische Ergänzung eines Seminars
  zur politischen Bildung oder zur Fortbildung in einem nicht-politischen Kontext.
  Bei der Bearbeitung eines Krisenszenarios werden nicht nur Teamfähigkeit bei der
  gemeinsamen Lösungsfindung geschult. Individuelle Fähigkeiten wie Rhetorik und das
  Vertreten eines eigenen Standpunkts gegenüber einer Gruppe werden hier ebenfalls
  verbessert. SSC Europe verfügt über ein Portfolio von Simulationen, entwickelt aber
  auch gerne ein auf Ihr vorgesehenes Lernziel zugeschnittenes Programm.
s2_text2_en: Simulations are excellent pedagogical supplements to seminars focusing
  on political education and training. By the comprehensive simulation of regular
  political processes or crisis scenarios, students develop a number of skills including
  teamwork, negotiation, effective decision-making as well as rhetoric and public
  speaking. SSC Europe has a portfolio of custom simulations but also regularly develops
  tailored programmes with respect to any given learning objective.
s3_kicker_de: Format
s3_kicker_en: Format
s3_h2_de: Planspielentwicklungsworkshops
s3_h2_en: Workshops on simulation development
s3_text_de: Neben der reinen Durchführung von Simulationen bieten wir auch Workshops
  zur Planspielentwicklung an. Dabei werden gemeinsam mit den Teilnehmern alle Aspekte
  einer Simulation von der Auswahl des zu simulierenden Organs über das Schreiben
  eines Szenarios bis zur Entwicklung der Länderprofile theoretisch erläutert und
  praktisch umgesetzt. Zusätzlich werden methodische und rhetorische Fähigkeiten geschult
  und Hinweise für das Rahmenprogramm sowie zu Finanzierungsmöglichkeiten gegeben.
s3_text_en: In addition to offering simulations, we also offer workshops on simulation
  development. All aspects of a simulation – from the selection of the simulated organization
  or process, to writing a scenario and the development of country profiles – are
  covered during these workshops. Together with the participants, all of those components
  of a simulation are discussed theoretically, followed by implementation. In addition,
  we offer advice and training in strategic thinking, rhetorical skills and framing
  a simulation to elicit successful financial backing.
