pagelead_de: Auf dieser Seite finden Sie Informationen über einige unserer Angebote,
  die wir mit unseren Kooperationspartnern durchgeführt haben. Sollten Sie Fragen
  zu unseren Formaten haben, können Sie jederzeit über unser Formular mit uns in Kontakt
  treten.
pagelead_en: On this page you will find information about some of the projects we
  have implemented with our partners. If you have questions about our formats, you
  can approach us at any time through our contact form.
s1_kicker_de: Format
s1_kicker_en: Format
s1_h2_de: Sommerschulen
s1_h2_en: Summer schools
s1_text_de: Bereits seit mehreren Jahren leiten unsere Experten Sommerschulen zu unterschiedlichen
  Themen im In- und Ausland. Einer der ersten Kooperationspartner von SSC Europe ist
  der Internationale Universitätsclub München e.V. (IUCM). Im Rahmen der Munich International
  Summer University (MISU) bieten Sebastian Schäffer, Michael Bauer und Christoph
  Schnellbach jeden August einen mehrwöchigen Kurs zur europäischen Integration an.
s1_text_en: For several years, our experts conduct summer schools on various topics
  in Germany and abroad. One of the first partners of SSC Europe was the International
  University Club Munich (IUCM). As part of the Munich International Summer University
  (MISU), Sebastian Schäffer, Michael Bauer and Christoph Schnellbach offer a multi-week
  course on European integration every August.
