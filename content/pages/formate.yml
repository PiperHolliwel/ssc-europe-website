s5_h2_en: SSC Europe global
s5_text_de: Die oben gezeigten Formate sind nur eine kleine Auswahl unserer Aktivitäten.
  Unsere Experten sind weltweit tätig. Um über die aktuellen Tätigkeiten auf dem Laufenden
  zu bleiben, folgen Sie uns auf Twitter oder liken Sie uns auf Facebook.
s5_text_en: The formats shown above are just a sample of our activities. Our experts
  are active worldwide. To stay updated on the current activities, follow us on Twitter
  or like us on Facebook.
