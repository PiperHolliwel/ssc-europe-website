bio_de: |-
  **Gründer, SSC Europe**

  * [Geschäftsführer am *Institut für den Donauraum und Mitteleuropa (IDM)*](http://www.idm.at/_ber_uns/team/lebenslaeufe/mag__sebastian_schaeffer/)
  * [Generalsekretär der *Donau Rektoren Konferenz*](https://www.drc-danube.org/)
  * [Freiberufliche Betreuung von Veranstaltungen der Öffentlichkeitsarbeit des *Deutschen Bundestags*](http://bundestag.de/service/kontakt/referatio2/244784)
  * [Dozent für den Bereich Europäische Union der Zentralen Fortbildung des *Hessischen Ministeriums des Inneren und für Sport*](https://innen.hessen.de/)
  * [Mitglied im Academic Council des *Munich European Forum e.V.*](http://europeanforum.de/academic-council/)
  * [Gründungsmitglied der *Middle East and International Affairs Research Group (MEIA Research)*](https://www.meia-research.org/deutsch/%C3%BCber-meia-research/)
  * [Mitglied im Advisory Board von *Discussing World Politics e.V.*](http://www.discussing-world-politics.org/about/the-advisors/)
bio_en: |-
  **Founder, SSC Europe**

  * [Managing Director at the *Institute for the Danube Region and Central Europe (IDM)*](http://www.idm.at/_ber_uns/team/lebenslaeufe/mag__sebastian_schaeffer/)
  * [Secretary General of the *Danube Rectors' Conference*](https://www.drc-danube.org/)
  * [Freelancer for public relation events of the *German Bundestag*](http://bundestag.de/service/kontakt/referatio2/244784)
  * [Lecturer on European Union related topics for future superior authorities on behalf of the *Central Department for Further Education of the Hessian Ministry of the Interior and Sports*](https://english.hessen.de/)
  * [Member of the Academic Council of the *Munich European Forum e.V.*](http://europeanforum.de/academic-council/)
  * [Founding member of *Middle East and International Affairs Research Group (MEIA Research)*](https://www.meia-research.org/english/about-meia-research/)
  * [Member of the Advisory Board of *Discussing World Politics*](http://www.discussing-world-politics.org/about/the-advisors/)
