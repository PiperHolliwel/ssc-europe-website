bio_de: |-
  **Associate**

  * [Dozent beim Bundesamt für Familie und zivilgesellschaftliche Aufgaben](http://bildungszentren.bafza.de/bildungszentren/geretsried/ansprechpersonen.html)
  * [Mitglied im Academic Council des Munich European Forum e.V.](http://europeanforum.de/academic-council/)
  * [Lehrbeauftragter am Geschwister-Scholl-Institut der Ludwigs-Maximilians-Universität München](http://www.gsi.uni-muenchen.de/personen/lehrbeauftragte/schnellbach/index.html)
  * [Andrássy Junior Research Fellow am Donau Institut für Interdisziplinäre Forschung](http://www.andrassyuni.eu/donauinstitut/team/andrassy-research-fellows/dr-christophschnellbach-junior-research-fellow)
bio_en: |-
  **Associate**

  * [Lecturer at federal office of family and civil society functions](http://bildungszentren.bafza.de/bildungszentren/geretsried/ansprechpersonen.html)
  * [Member of the Academic Council Munich European Forum e.V.](http://europeanforum.de/academic-council/)
  * [Lecturer at the Geschwister-Scholl-Institute for Political Science at the Ludwigs-Maximilians-University Munich](http://www.gsi.uni-muenchen.de/personen/lehrbeauftragte/schnellbach/index.html)
  * [Andrássy Junior Research Fellow at the Danube-Institute for Interdisciplinary Research](http://www.andrassyuni.eu/donauinstitut/team/andrassy-research-fellows/dr-christophschnellbach-junior-research-fellow)
